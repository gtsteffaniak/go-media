name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FFMPEG_VERSION: "9.0.2"

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            profile: production
          - os: ubuntu-24.04-arm
            arch: arm64
            profile: production
          - os: ubuntu-latest
            arch: amd64
            profile: nopgo
          - os: ubuntu-24.04-arm
            arch: arm64
            profile: nopgo
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache: true
      - name: Install static ffmpeg
        if: matrix.os == 'ubuntu-latest'
        run: FFMPEG_FORCE_INSTALL=1 bash scripts/install-ffmpeg.sh
      - name: Generate fixtures
        if: matrix.os == 'ubuntu-latest' && matrix.profile == 'production'
        run: ./scripts/generate-fixtures.sh
      - name: Vet
        run: CGO_ENABLED=0 go vet ./...
      - name: Test
        run: |
          if [ "${{ matrix.profile }}" = "production" ]; then
            CGO_ENABLED=0 GOFLAGS=-pgo=default.pgo go test ./...
          else
            CGO_ENABLED=0 go test ./...
          fi
      - name: Fuzz smoke (subtitle, amd64 production only)
        if: matrix.os == 'ubuntu-latest' && matrix.profile == 'production'
        run: CGO_ENABLED=0 GOFLAGS=-pgo=default.pgo go test -fuzz=FuzzParseSRT -fuzztime=10s ./internal/subtitle

  test-go-latest:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Smoke test on latest Go (archsimd API churn)
        run: CGO_ENABLED=0 GOEXPERIMENT=simd go test ./internal/kernels/h264/ -run 'TestSIMDConsumer|TestSIMDCPU' -count=1

  compare-gate:
    name: ffmpeg comparison gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache: true
      - name: Install static ffmpeg
        run: FFMPEG_FORCE_INSTALL=1 bash scripts/install-ffmpeg.sh
      - name: Verify PGO profile
        run: test -s default.pgo && test -s default.pgo.provenance.json
      - name: Check PGO freshness
        run: make check-pgo
      - name: Generate compare assets
        run: ./scripts/generate-fixtures.sh
      - name: Comparison gate
        run: make compare-gate
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: comparison-report
          path: test/compare/report_site/
          if-no-files-found: error
