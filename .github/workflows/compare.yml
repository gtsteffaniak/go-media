name: Comparison

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: comparison-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FFMPEG_VERSION: "9.0.2"

jobs:
  compare:
    name: go-media vs ffmpeg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true
      - name: Install static ffmpeg
        run: bash scripts/install-ffmpeg.sh
      - name: Run comparison suite (with gate)
        run: make compare-gate
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: comparison-report
          path: test/compare/report_site/
          if-no-files-found: error
